<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UG3_IMU — Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="description" content="IMU gait-analysis toolbox docs — MAI Lab">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Tone down the vue theme's default orange inline-code/token color —
       these docs are dense with inline `code`, so the stock #e96900 reads
       as a wall of orange. Reuse the theme's own teal accent instead. */
    code, .token.function, .token.keyword, .token.tag, .token.number,
    .token.property, .token.attr-name { color: #2c6e5c !important; }
    code { background-color: #f4f6f5; }
    pre code, pre[class*="lang-"] { background-color: transparent; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'UG3_IMU',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
